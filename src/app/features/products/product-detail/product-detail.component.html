<ng-container *ngIf="product as p; else notFound">
  <div class="row g-4">
    <div class="col-12 col-lg-6">
      <div class="card shadow-sm">
        <img
          *ngIf="p.imageUrl"
          [src]="p.imageUrl"
          [alt]="p.title"
          decoding="async"
          fetchpriority="high"
          width="1200"
          height="800"
          class="card-img-top"
          style="aspect-ratio: 3 / 2; object-fit: cover;"
        />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <h1 class="h4">{{ p.title }}</h1>
          <p class="text-muted">{{ p.description }}</p>
          <div class="display-6 text-primary fw-semibold mb-3">{{ p.price | currency }}</div>

          <div class="mt-auto d-flex flex-wrap gap-2">
            <button class="btn btn-primary" (click)="addToCart(p)">Add to Cart</button>
            <button class="btn" [ngClass]="isFav(p) ? 'btn-warning' : 'btn-outline-warning'" (click)="toggleFav(p)">
              <span *ngIf="isFav(p)">★ Favorited</span>
              <span *ngIf="!isFav(p)">☆ Favorite</span>
            </button>
            <button class="btn btn-outline-primary" (click)="shareProduct(p)" aria-label="Share product">Share
            </button>
            <a routerLink="/products" class="btn btn-outline-secondary">Back</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #notFound>
  <div class="alert alert-warning" role="alert">
    Product not found. <a routerLink="/products" class="alert-link">Back to list</a>
  </div>
</ng-template>
